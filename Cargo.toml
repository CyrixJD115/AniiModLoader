[workspace]
resolver = "2"
members = [
    "crates/aniimod-map",
    "crates/aniimod-ffi",
    "crates/aniimod-metadata",
    "crates/aniimod-hook",
    "crates/aniimod-mod",
    "crates/aniimod-host",
    "mods/anii-example",
    "mods/anii-signal",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
