on:
  workflow_call:
    inputs:
      TAG:
        required: true
        type: string
      RELEASE_NAME:
        required: true
        type: string
  
jobs:
  upload_github:
    name: Upload GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Download Windows x86 Artifact
        uses: actions/download-artifact@v8
        with:
          name: AniiModLoader.Windows.x86.CI.Release
          path: ./compiled_release/windows_x86
      - name: Package Windows x86 into Zip Archive
        run: |
          cd compiled_release/windows_x86
          zip -r ../AniiModLoader.x86.zip ./
      
      - name: Download Windows x64 Artifact
        uses: actions/download-artifact@v8
        with:
          name: AniiModLoader.Windows.x64.CI.Release
          path: ./compiled_release/windows_x64
      - name: Package Windows x64 into Zip Archive
        run: |
          cd compiled_release/windows_x64
          zip -r ../AniiModLoader.x64.zip ./
        
      - name: Download Linux x64 Artifact
        uses: actions/download-artifact@v8
        with:
          name: AniiModLoader.Linux.x64.CI.Release
          path: ./compiled_release/linux_x64
      - name: Package Linux x64 into Zip Archive
        run: |
          cd compiled_release/linux_x64
          zip -r ../AniiModLoader.Linux.x64.zip  ./
        
      - name: Download MacOS x64 Artifact
        uses: actions/download-artifact@v8
        with:
          name: AniiModLoader.macOS.x64.CI.Release
          path: ./compiled_release/macos_x64
      - name: Package MacOS x64 into Zip Archive
        run: |
          cd compiled_release/macos_x64
          zip -r ../AniiModLoader.macOS.x64.zip  ./
          
      - name: Download AniiModLoader Installer
        run: |
          curl -L https://github.com/CyrixJD115/AniiModLoader.Installer/releases/latest/download/AniiModLoader.Installer.exe -o compiled_release/AniiModLoader.Installer.exe
          curl -L https://github.com/CyrixJD115/AniiModLoader.Installer/releases/latest/download/AniiModLoader.Installer.Linux -o compiled_release/AniiModLoader.Installer.Linux
          curl -L https://github.com/CyrixJD115/AniiModLoader.Installer/releases/latest/download/AniiModLoader.Installer.MacOS.dmg -o compiled_release/AniiModLoader.Installer.MacOS.dmg

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE-NOTES.md
          tag: ${{ inputs.TAG }}
          release_name: ${{ inputs.RELEASE_NAME }}
          files: |
            compiled_release/AniiModLoader.x86.zip
            compiled_release/AniiModLoader.x64.zip
            compiled_release/AniiModLoader.Linux.x64.zip
            compiled_release/AniiModLoader.macOS.x64.zip
            compiled_release/AniiModLoader.Installer.exe
            compiled_release/AniiModLoader.Installer.Linux
            compiled_release/AniiModLoader.Installer.MacOS.dmg
